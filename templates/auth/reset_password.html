<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Reset Password</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-height: 100vh;
        background: #f5f7fb;
      }

      .auth-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .auth-card {
        width: 100%;
        max-width: 430px;
        border: 0;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      }

      .auth-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #e9f2ff;
        color: #0d6efd;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 28px;
      }

      .form-control {
        min-height: 48px;
        border-radius: 8px;
      }

      .btn-reset {
        min-height: 48px;
        border-radius: 8px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="auth-wrapper px-3">
      <div class="card auth-card">
        <div class="card-body p-4 p-md-5">
          <div class="auth-icon">
            <i class="bi bi-shield-lock"></i>
          </div>

          <div class="text-center mb-4">
            <h3 class="fw-bold mb-2">Reset Password</h3>
            <p class="text-muted mb-0">
              Create a new password for your account.
            </p>
          </div>

          {% if error %}
          <div class="alert alert-danger d-flex align-items-start" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <div>{{ error }}</div>
          </div>
          {% endif %} {% if token %}

          <form method="POST" action="/reset-password">
            <input type="hidden" name="token" value="{{ token }}" />
            <div class="mb-3">
              <label for="password" class="form-label fw-semibold"
                >New Password</label
              >
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Enter new password"
                minlength="8"
                autocomplete="new-password"
                required
              />
              <div class="form-text">
                Password must be at least 8 characters.
              </div>
            </div>
            <div class="mb-4">
              <label for="confirm_password" class="form-label fw-semibold"
                >Confirm Password</label
              >
              <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                class="form-control"
                placeholder="Confirm new password"
                minlength="8"
                autocomplete="new-password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-reset w-100">
              <i class="bi bi-check2-circle me-2"></i>Reset Password
            </button>
          </form>
          {% else %}
          <div class="text-center">
            <a href="/forgot-password" class="btn btn-primary w-100 btn-reset"
              >Request New Reset Link</a
            >
          </div>
          {% endif %}
          <div class="text-center mt-4">
            <a href="/login" class="text-decoration-none">
              <i class="bi bi-arrow-left me-1"></i>
              Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </body>
</html>
