{% extends "includes/base.html" %}

{% block title %}
Edit User
{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1">Edit User</h4>
            <p class="text-muted mb-0">Update user account information</p>
        </div>

        <a href="/users" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            Back to Users
        </a>
    </div>


    <div class="row">
        <div class="col-xl-12 col-lg-10">

            <div class="card border-0 shadow-sm">

                <div class="card-header bg-white py-3">
                    <h5 class="mb-0">
                        <i class="bi bi-pencil-square me-2"></i>
                        User Information
                    </h5>
                </div>


                <div class="card-body p-4">

                    <div id="formMessage"></div>

                    <form id="editUserForm">

                        <!-- User ID -->
                        <input
                            type="hidden"
                            id="user_id"
                            name="user_id"
                            value="{{ user.id }}"
                        >


                        <div class="row g-3">

                            <!-- Name -->
                            <div class="col-md-4">

                                <label for="name" class="form-label">
                                    Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    value="{{ user.name or '' }}"
                                    placeholder="Enter full name"
                                    required >
                            </div>


                            <!-- Username -->
                            <div class="col-md-4">

                                <label for="username" class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    name="username"
                                    value="{{ user.username }}"
                                    placeholder="Enter username"
                                    required
                                >

                            </div>


                            <!-- Email -->
                            <div class="col-md-4">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    value="{{ user.email }}"
                                    placeholder="Enter email"
                                    required
                                >

                            </div>


                            <!-- Role -->
                            <div class="col-md-4">

                                <label for="role" class="form-label">
                                    Role
                                </label>

                                <select
                                    class="form-select"
                                    id="role"
                                    name="role"
                                    required
                                >

                                    <option value="">Select Role</option>

                                    <option
                                        value="superadmin"
                                        {% if user.role == 'superadmin' %}selected{% endif %}
                                    >
                                        Super Admin
                                    </option>

                                    <option
                                        value="admin"
                                        {% if user.role == 'admin' %}selected{% endif %}
                                    >
                                        Admin
                                    </option>

                                    <option
                                        value="user"
                                        {% if user.role == 'user' %}selected{% endif %}
                                    >
                                        User
                                    </option>

                                </select>

                            </div>


                            <!-- Team -->
                            <div class="col-md-4">

                                <label for="team_id" class="form-label">
                                    Team
                                </label>

                                <select
                                    class="form-select"
                                    id="team_id"
                                    name="team_id"
                                    required
                                >

                                    <option value="">Select Team</option>

                                    <option
                                        value="cnk"
                                        {% if user.team_id == 'cnk' %}selected{% endif %}
                                    >
                                        CNK
                                    </option>

                                    <option
                                        value="tmi"
                                        {% if user.team_id == 'tmi' %}selected{% endif %}
                                    >
                                        TMI
                                    </option>

                                </select>

                            </div>


                            <!-- Status -->
                            <div class="col-md-4">

                                <label for="is_active" class="form-label">
                                    Status
                                </label>

                                <select
                                    class="form-select"
                                    id="is_active"
                                    name="is_active"
                                >

                                    <option
                                        value="1"
                                        {% if user.is_active == 1 %}selected{% endif %}
                                    >
                                        Active
                                    </option>

                                    <option
                                        value="0"
                                        {% if user.is_active == 0 %}selected{% endif %}
                                    >
                                        Inactive
                                    </option>

                                </select>

                            </div>


                            <!-- New Password -->
                            <div class="col-md-6">

                                <label for="password" class="form-label">
                                    New Password
                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="Leave blank to keep current password"
                                    >

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="togglePassword"
                                    >
                                        <i
                                            class="bi bi-eye"
                                            id="passwordIcon"
                                        ></i>
                                    </button>

                                </div>

                                <small class="text-muted">
                                    Leave blank if you don't want to change the password.
                                </small>

                            </div>


                            <!-- Confirm Password -->
                            <div class="col-md-6">

                                <label for="confirm_password" class="form-label">
                                    Confirm New Password
                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="confirm_password"
                                        name="confirm_password"
                                        placeholder="Re-enter new password"
                                    >

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="toggleConfirmPassword"
                                    >
                                        <i
                                            class="bi bi-eye"
                                            id="confirmPasswordIcon"
                                        ></i>
                                    </button>

                                </div>

                                <div
                                    id="passwordError"
                                    class="text-danger small mt-1"
                                    style="display:none;"
                                >
                                    Passwords do not match.
                                </div>

                            </div>

                        </div>


                        <hr class="my-4">


                        <!-- Buttons -->
                        <div class="d-flex justify-content-end gap-2">

                            <a
                                href="/users"
                                class="btn btn-light border"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                                id="updateUserBtn"
                            >
                                <i class="bi bi-check-lg me-1"></i>
                                Update User
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
$(document).ready(function () {
 
    $("#togglePassword").on("click", function () {
        const input = $("#password");
        const icon = $("#passwordIcon");
        if (input.attr("type") === "password") {
            input.attr("type", "text");
            icon.removeClass("bi-eye").addClass("bi-eye-slash");
        } else {
            input.attr("type", "password");
            icon.removeClass("bi-eye-slash").addClass("bi-eye");
        }
    });

    $("#toggleConfirmPassword").on("click", function () {
        const input = $("#confirm_password");
        const icon = $("#confirmPasswordIcon");
        if (input.attr("type") === "password") {
            input.attr("type", "text");
            icon.removeClass("bi-eye").addClass("bi-eye-slash");
        } else {
            input.attr("type", "password");
            icon.removeClass("bi-eye-slash").addClass("bi-eye");
        }
    });

    $("#password, #confirm_password").on("input", function () {
        const password = $("#password").val();
        const confirmPassword = $("#confirm_password").val();
        if (password === "" && confirmPassword === "") {
            $("#passwordError").hide();
            $("#confirm_password").removeClass("is-valid is-invalid");
            return;
        }
        if (password === confirmPassword) {
            $("#passwordError").hide();
            $("#confirm_password").removeClass("is-invalid").addClass("is-valid");
        } else {
            $("#passwordError").show();
            $("#confirm_password").removeClass("is-valid").addClass("is-invalid");
        }
    });

    $("#editUserForm").on("submit", function (e) {
        e.preventDefault();
        const userId = $("#user_id").val();
        const password = $("#password").val();
        const confirmPassword = $("#confirm_password").val();
        if (password !== "" || confirmPassword !== "") {
            if (password !== confirmPassword) {
                $("#passwordError").show();
                $("#confirm_password")
                    .addClass("is-invalid")
                    .focus();
                return false;
            }

        }


        const team_id = $("#team_id").val();

        const team_name =$("#team_id option:selected").text().trim();

        const formData = {
            name: $("#name").val().trim(),
            username: $("#username").val().trim(),
            email: $("#email").val().trim(),
            role: $("#role").val(),
            team_id: team_id,
            team_name: team_name,
            is_active: $("#is_active").val(),
            password: password,
            confirm_password: confirmPassword
        };


        const button = $("#updateUserBtn");
        button.prop("disabled", true);
        button.html(`
            <span
                class="spinner-border spinner-border-sm me-1"
            ></span>
            Updating...
        `);
        $.ajax({
            url: "/users/update/" + userId,
            type: "POST",
            data: formData,
            success: function (response) {
                $("#formMessage").html(`
                    <div class="alert alert-success">
                        ${response.message || "User updated successfully."}
                    </div>
                `);
                setTimeout(function () {
                    window.location.href = "/users";
                }, 1000);
            },
            error: function (xhr) {
                console.log(xhr.responseText);
                let message = "Something went wrong.";
                if (
                    xhr.responseJSON &&
                    xhr.responseJSON.detail
                ) {
                    message = xhr.responseJSON.detail;
                }
                $("#formMessage").html(`
                    <div class="alert alert-danger">
                        ${message}
                    </div>
                `);
                button.prop("disabled", false);
                button.html(`
                    <i class="bi bi-check-lg me-1"></i>
                    Update User
                `);
            }
        });
    });
});

</script>

{% endblock %}
